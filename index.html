<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff4fb4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="友だちと1時間ごとの2秒動画で、同じ1日をシェアしてVlogに残す">
  <title>setlog2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top hidden" id="top"></header>
  <main id="view"></main>
  <div id="overlay"></div>
  <div id="backdrop" class="backdrop hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="banner" class="banner hidden" role="alert"></div>
  <input id="file-bgm" type="file" accept="audio/*" class="hidden">
  <input id="file-photo" type="file" accept="image/*" class="hidden">
  <script type="module" src="js/app.js"></script>
</body>
</html>
